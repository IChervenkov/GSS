plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.example.rfidlaundryasset'
    compileSdk = 34

    defaultConfig {
        applicationId "com.example.rfidlaundryasset"
        minSdk = 30
        targetSdk = 34
        versionCode 4
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            shrinkResources = true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11

        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs += ["-Xlint:unchecked", "-Xlint:deprecation"]
        }
    }

    // add the code from below line.
    applicationVariants.all{
            // this method is use to rename your all apk weather
            // it may be signed or unsigned(debug apk)
        variant ->
            variant.outputs.each{
                    // on below line we are setting a
                    // name to our apk as GFG.apk
                output->
                    def name = "RFIDLaundryAsset-${versionName}-release.apk"
                    // on below line we are setting the
                    // outputFile Name to our apk file.
                    output.outputFileName = name
            }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation libs.retrofit
    implementation libs.converter.gson

    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.12.0'

