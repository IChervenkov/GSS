services:
  app:
    image: ghcr.io/your-org/gss:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /opt/gss/.env
    environment:
      NODE_ENV: staging
      ENVIRONMENT_NAME: staging
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: stop-first
