name: Governance Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate governance artifacts
        run: node src/operations/ci/scripts/check-governance.mjs

      - name: Validate alert and runbook links
        run: node src/operations/ci/scripts/check-alert-runbook-links.mjs
